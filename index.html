<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library Management Web </title>
</head>
<body>
    <main>
        <h1>Library Management Web</h1>
        <button type="button" id="open-book-dialog" >Add Book</button>
        <dialog id="book-dialog" closedby="any">
            <h2 id="dialog-title">Add a book</h2>
            <form id="book-form">
                <label for="title">Title of book</label>
                <input type="text" name="title" id="title" maxlength="30" required>

                <label for="author">Author of book</label>
                <input type="text" name="author" id="author" maxlength="30" required>

                <label for="pages">Number of pages</label>
                <input type="number" id="pages" min="1"  name="pages" min="1" required>
                
                <div>
                <input type="checkbox" name="status" id="status">
                <label for="status">Have you read it?</label>
                </div>

                <div class="form-button">
                    <button type="submit" >Save book</button>
                    <button type="button" id="cancel-form-button" >Cancel</button>
                </div>
            </form>
        </dialog>
        <section>
            <h2>My Library</h2>
            <input type="text" id="search-input">
            <p id="status-message"></p>
        </section>
        <div id="library"></div>

    </main>
   <script src="script.js"></script>
</body>
</html>
